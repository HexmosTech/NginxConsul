# Native replacement for ngx_http_consul_backend_module.
#
# Requires nginx 1.27.3 or newer, open-source build. Target: 1.30.6.
# The upstream block must use a zone. Active health checks are commercial;
# Consul DNS returns only passing services, and nginx does passive failover.
#
# Consul DNS listens on 127.0.0.1:8600 by default.
# The SRV name is _<service>._tcp.service.consul.
# nginx joins service= and server, so:
#   service=_my-service._tcp + server service.consul
# gives _my-service._tcp.service.consul.

resolver 127.0.0.1:8600 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server service.consul service=_my-service._tcp resolve;
}

server {
    listen 80;
    server_name example.com;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# If the service uses port 80 and an A record is enough, drop the SRV form:
#
#   upstream backend {
#       zone backend 64k;
#       server my-service.service.consul resolve;
#   }
